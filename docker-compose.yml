version: "3.9"

services:
  homelab-ai:
    build: .
    image: homelab-ai:latest
    container_name: homelab-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./.env:/app/.env:ro
      - ./plugins:/app/plugins
      - ./history:/app/history
      - ./sessions.db:/app/sessions.db
    environment:
      - TZ=Asia/Jakarta
    command: ["mcp-server", "--host", "0.0.0.0", "--port", "8000"]

  # Optional: run the TUI interactively
  # docker compose run --rm homelab-tui
  homelab-tui:
    build: .
    image: homelab-ai:latest
    container_name: homelab-ai-tui
    stdin_open: true
    tty: true
    volumes:
      - ./.env:/app/.env:ro
      - ./plugins:/app/plugins
      - ./history:/app/history
    command: []
