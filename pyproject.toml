[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-ai"
version = "2.1.0"
description = "Terminal AI companion with integrated local system tools."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "textual>=7.1.1,<8.0", "rich>=13.7,<14.0",
    "openai>=1.40", "google-genai>=1.0", "g4f>=0.3", "python-dotenv>=1.0",
    "langgraph>=0.2", "fastmcp>=0.1",
    "httpx>=0.27", "requests>=2.31", "beautifulsoup4>=4.12",
    "pypdf>=4.2", "pdfplumber>=0.11", "youtube-transcript-api>=0.6",
    "ddgs>=6.0", "pandas>=2.2", "openpyxl>=3.1", "pillow>=10.3",
    "tabulate>=0.9", "markdown>=3.6", "pyyaml>=6.0", "pyarrow>=18.0",
    "pathspec>=0.12", "chromadb>=0.5",
    "tree-sitter>=0.23", "tree-sitter-languages>=1.10", "jedi>=0.19",
    "radon>=6.0", "black>=24.4", "isort>=5.13", "pylint>=3.2",
    "GitPython>=3.1",
    "pydantic>=2.7", "tiktoken>=0.7", "jsonref>=1.1", "dirtyjson>=1.0",
    "ijson>=3.2", "msgpack>=1.0", "ujson>=5.10", "cryptography>=42.0",
    "psutil>=5.9", "docker>=7.1", "pexpect>=4.9", "plumbum>=1.8",
    "watchfiles>=0.21", "watchdog>=4.0", "appdirs>=1.4",
    "paramiko>=3.4", "scp>=0.15", "pyperclip>=1.9",
    "tenacity>=8.3", "backoff>=2.2", "loguru>=0.7", "tqdm>=4.66",
    "schedule>=1.2", "python-crontab>=3.0", "rpyc>=6.0", "pluggy>=1.5",
    "blinker>=1.8",
    "playwright>=1.50", "selenium>=4.20", "mechanicalsoup>=1.3",
    "cloudscraper>=1.2", "requests-html>=0.10", "pyautogui>=0.9",
    "opencv-python>=4.10", "pynput>=1.7", "screeninfo>=0.8", "mss>=9.0",
    "sqlalchemy>=2.0", "motor>=3.4", "redis>=5.1", "pymongo>=4.7",
    "paho-mqtt>=2.1", "broadlink>=0.19", "pyproxmox>=1.0",
    "wakeonlan>=3.0", "ping3>=4.0", "netifaces2>=0.0.22", "scapy>=2.5",
    "dnspython>=2.6",
    "numpy>=2.0", "scipy>=1.14", "scikit-learn>=1.5", "networkx>=3.3",
    "gTTS>=2.5", "SpeechRecognition>=3.11", "pydub>=0.25", "sounddevice>=0.5",
    "pyfiglet>=1.0.2", "art>=6.2", "crayons>=0.4.0", "humanize>=4.9",
    "python-slugify>=8.0", "parse>=1.20", "arrow>=1.3", "croniter>=2.0",
    "pyotp>=2.9", "qrcode>=7.4", "prometheus-client>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
homelab-ai = "homelab_ai.__main__:main"

[tool.setuptools]
packages = ["homelab_ai", "homelab_ai.os", "homelab_ai.ui"]